# External uptime check for serbanserver - dead-man's switch.
#
# WHY THIS SHAPE: the obvious design (probe the public URLs from here) does not
# work. Cloudflare's free Bot Fight Mode returns 403 to datacenter IPs, and a
# GitHub runner is one - verified 2026-08-18, all three endpoints returned 403
# to the runner while returning 200/200/302 from the owner's home IP. Per
# Cloudflare's docs, Bot Fight Mode "does not run on the Ruleset Engine", so no
# WAF Skip rule can whitelist a prober; the only inbound fixes are disabling bot
# protection or paying for Super Bot Fight Mode.
#
# So the direction is inverted. serbanserver force-pushes a timestamp to the
# "heartbeat" branch every 10 minutes (/usr/local/sbin/uptime-heartbeat.sh, via
# uptime-heartbeat.timer). This job just checks how old that timestamp is.
# Outbound traffic never meets inbound bot protection, so nothing had to be
# weakened to make monitoring work.
#
# WHAT THIS CATCHES: total loss - power, network, ISP, drive, kernel panic.
# WHAT IT DOES NOT: anything while the box is alive. Uptime Kuma covers that,
# including public reachability, since it probes the site through Cloudflare
# and so notices a dead tunnel.
#
# Keep this repo PUBLIC: scheduled Actions are unmetered on public repos, and
# this job needs no secrets to read a public branch.

name: External uptime check

on:
  schedule:
    # Every 15 minutes. GitHub's scheduler is best-effort and runs late under
    # load, which is fine: staleness is measured from the timestamp in the
    # branch, not from when this job happens to run.
    - cron: '*/15 * * * *'
  workflow_dispatch:

# Read-only. The old design needed write access for an anti-hibernation commit;
# the server's own heartbeat pushes are now the repository activity that keeps
# GitHub from disabling this schedule after 60 days.
permissions:
  contents: read

concurrency:
  group: external-uptime
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Declared at JOB level on purpose: a step's own env: block is not visible
      # to that step's if: condition, so a step-level declaration would make the
      # guard below always evaluate empty and the alert would never fire.
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      # Server beats every 10 minutes; alert after ~3 consecutive misses so a
      # single blip or a slow scheduler does not page anyone.
      MAX_AGE_SECONDS: '2100'

    steps:
      - name: Fetch the heartbeat branch
        uses: actions/checkout@v4
        with:
          ref: heartbeat
          fetch-depth: 1

      - name: Check heartbeat freshness
        id: check
        run: |
          set -uo pipefail

          if [ ! -f beat ]; then
            echo "::error::heartbeat branch has no 'beat' file"
            echo "stale=1" >> "$GITHUB_OUTPUT"
            echo "detail=heartbeat branch is missing its beat file" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Strip anything non-numeric rather than trusting the file blindly.
          beat="$(tr -dc '0-9' < beat)"
          if [ -z "$beat" ]; then
            echo "::error::beat file is empty or non-numeric"
            echo "stale=1" >> "$GITHUB_OUTPUT"
            echo "detail=beat file empty or non-numeric" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          human="$(cat beat.human 2>/dev/null || echo 'unknown')"
          now="$(date -u +%s)"
          age=$(( now - beat ))

          # Negative age means the server clock is ahead of GitHub's. That is a
          # clock problem, not an outage - do not page for it.
          if [ "$age" -lt 0 ]; then
            echo "::warning::server clock appears ahead of GitHub by $(( -age ))s"
            age=0
          fi

          echo "last beat : $human"
          echo "age       : ${age}s (limit ${MAX_AGE_SECONDS}s)"

          if [ "$age" -gt "$MAX_AGE_SECONDS" ]; then
            mins=$(( age / 60 ))
            echo "stale=1" >> "$GITHUB_OUTPUT"
            echo "detail=No heartbeat from serbanserver for ${mins} minutes (last beat ${human} UTC, limit $(( MAX_AGE_SECONDS / 60 ))m). The server is likely off, offline, or has lost power." >> "$GITHUB_OUTPUT"
          else
            echo "stale=0" >> "$GITHUB_OUTPUT"
            echo "heartbeat healthy"
          fi

      - name: Push alert to ntfy.sh
        # Your self-hosted ntfy is Tailscale-only and unreachable from GitHub,
        # so this uses public ntfy.sh with a topic only you know.
        if: steps.check.outputs.stale == '1' && env.NTFY_TOPIC != ''
        env:
          DETAIL: ${{ steps.check.outputs.detail }}
        run: |
          curl -s -m 15 \
            -H "Title: serbanserver may be DOWN" \
            -H "Priority: urgent" \
            -H "Tags: rotating_light" \
            --data-binary "$DETAIL" \
            "https://ntfy.sh/${NTFY_TOPIC}" >/dev/null || true

      - name: Fail if the heartbeat is stale
        # A failed run is what triggers GitHub's own email, so this remains the
        # baseline alert channel even with no ntfy topic configured.
        if: steps.check.outputs.stale == '1'
        env:
          DETAIL: ${{ steps.check.outputs.detail }}
        run: |
          echo "::error::${DETAIL}"
          exit 1
